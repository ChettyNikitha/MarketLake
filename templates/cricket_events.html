<!DOCTYPE html>
<html>
<head>
    <title>Cricket Events</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #1f2937;
            margin-bottom: 40px;
        }

        .event-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .event-title {
            font-size: 22px;
            font-weight: bold;
            color: #111827;
            margin-bottom: 10px;
        }

        .event-info {
            color: #4b5563;
            margin-bottom: 8px;
        }

        .details-link {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 16px;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .details-link:hover {
            background-color: #1d4ed8;
        }
        .back-home {
    display: inline-block;
    margin-bottom: 25px;
    color: #2563eb;
    text-decoration: none;
    font-weight: bold;
}

.back-home:hover {
    text-decoration: underline;
}
    </style>
</head>

<body>
    <h1>Cricket Events</h1>
    <a class="back-home" href="/">← Back to Home</a>
    {% for event in events %}
        <div class="event-card">
            <div class="event-title">{{ event.title }}</div>

            <div class="event-info">
                <strong>Start Date:</strong> {{ event.start_date }}
            </div>

            <div class="event-info">
                <strong>Event Ticker:</strong> {{ event.event_ticker }}
            </div>

            <a class="details-link" href="/cricket-event-details/{{ event.event_ticker }}">
                View Market Details
            </a>
        </div>
    {% endfor %}
</body>
</html>
