[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Ruff's documented default rule set: pyflakes (F) plus a small subset of
# pycodestyle (E) errors. Kept explicit here so CI behavior doesn't drift
# with whatever ruff defaults happen to be on the runner.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
